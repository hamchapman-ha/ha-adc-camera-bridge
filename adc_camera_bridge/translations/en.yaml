configuration:
  rtsp_port:
    name: RTSP port
    description: Port the camera streams are served on.
  lan_access:
    name: Allow other devices on your network
    description: >-
      Off keeps the streams private to Home Assistant (recommended). On makes
      them reachable from other devices and requires a username and password.
  rtsp_username:
    name: RTSP username
    description: Only used when other devices are allowed.
  rtsp_password:
    name: RTSP password
    description: Only used when other devices are allowed.
  exclude:
    name: Cameras to skip
    description: >-
      Comma-separated camera entity IDs to leave out, for example
      camera.garden_camera. Leave empty to include every Alarm.com camera.
  linger_seconds:
    name: Keep camera sessions open (seconds)
    description: >-
      How long a camera stays connected after the last viewer leaves. Keeps
      the Home app's regular previews on one session instead of reconnecting
      for each one, and makes opening live view instant. 0 disconnects
      straight away.
  request_hd:
    name: Ask cameras for HD
    description: >-
      Request 1280x720 the way Alarm.com's own web player does. Off leaves the
      cameras at their default 640x360, which is lighter on Home Assistant
      when it re-encodes video for the Home app.
  log_level:
    name: Log level
    description: Use debug to see more detail from the camera connections.
